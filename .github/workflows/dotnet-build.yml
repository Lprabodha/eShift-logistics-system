name: .NET Desktop App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:
  # Uncomment below for tag triggers
  # push:
  #   tags:
  #     - '*'

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ '8.0.x' ]

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v3

      - name: ⚡️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            **/obj/project.assets.json
          key: nuget-${{ runner.os }}-${{ matrix.dotnet-version }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.dotnet-version }}-
            nuget-${{ runner.os }}-
            nuget-

      - name: 🧰 Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: 🔍 Restore NuGet Packages
        run: dotnet restore

      - name: 🛠️ Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run Tests
        run: dotnet test --no-build --configuration Release
        continue-on-error: true

      - name: 📦 Collect Build Artifacts
        if: success()
        run: |
          mkdir -p output
          Get-ChildItem -Path . -Filter *.exe -Recurse | Where-Object { $_.FullName -match '\\bin\\Release\\' } | Copy-Item -Destination output -Force
        shell: pwsh

      - name: 📑 Publish App
        if: success()
        run: |
          dotnet publish -c Release -r win-x64 --output published
        shell: pwsh

      - name: 📤 Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eShift-Desktop-Build
          path: output

      - name: 📤 Upload Published App
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eShift-Desktop-Published
          path: published